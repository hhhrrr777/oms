worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;                     # 官方镜像中解析为 /etc/nginx/mime.types
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;                     # Excel/POI 导入（默认 1m 会失败）
    gzip_static  on;                              # 前端构建已产出 .gz 预压缩文件

    server {
        listen       80;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 三种构建模式的前端都能用：/prod-api /dev-api /stage-api 全部代理到 api。
        # proxy_pass 尾斜杠剥前缀 —— 与 vue.config.js devServer 的 pathRewrite 语义一致。
        # SSE 关键配置必须保留：http_version 1.1 / buffering off / 1800s 超时。

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # --- SSE 关键配置 ---
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 60s;
            # --- 结束 ---
            proxy_pass http://api:8086/;
        }

        location /dev-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 60s;
            proxy_pass http://api:8086/;
        }

        location /stage-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 60s;
            proxy_pass http://api:8086/;
        }
    }
}
