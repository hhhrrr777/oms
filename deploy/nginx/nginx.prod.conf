worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;                     # 官方镜像中解析为 /etc/nginx/mime.types
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;                     # Excel/POI 导入（默认 1m 会失败）
    gzip_static  on;                              # 前端构建已产出 .gz 预压缩文件

    # ---- 80 继续并行提供服务、不做 https 跳转（兼容内网/IP 直连访问） ----
    server {
        listen       80;
        server_name  erp.benshutech.com;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # --- SSE 关键配置 ---
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 60s;
            # --- 结束 ---
            proxy_pass http://api:8086/;
        }
    }

    # ---- HTTPS ----
    server {
        listen       443 ssl;
        server_name  erp.benshutech.com;

        ssl_certificate     /etc/nginx/cert/benshutech.com.pem;
        ssl_certificate_key /etc/nginx/cert/benshutech.com.key;
        ssl_session_timeout  5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # --- SSE 关键配置 ---
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 60s;
            # --- 结束 ---
            proxy_pass http://api:8086/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
